[project]
name = "fullstack"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
