name: interview-fullstack
services:
  source-mock:
    build: .
    ports:
      - "127.0.0.1:${SOURCE_PORT:-8093}:8000"
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:17.4-bookworm@sha256:304ab813518754228f9f792f79d6da36359b82d8ecf418096c636725f8c930ad
    environment:
      POSTGRES_DB: reporting
      POSTGRES_USER: importer
      POSTGRES_PASSWORD: demo-importer-local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5543}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U importer -d reporting"]
      interval: 5s
      timeout: 3s
      retries: 20
  onec:
    # Настоящая 1С (автономный сервер ibsrv). Профиль onec: обычный `docker compose up`
    # её не трогает, т.к. для сборки нужен дистрибутив в onec-dist/. Восстановление: onec/restore.sh
    profiles: ["onec"]
    build:
      context: ./onec
      additional_contexts:
        dist: ./onec-dist
    image: recon-onec:8.3.27.2342
    platform: linux/amd64
    hostname: recon-onec
    init: true
    command: ["ibsrv", "--data=/onec/data", "-c", "/onec/ibsrv/api.yml"]
    stop_grace_period: 10s
    environment:
      ONEC_ADMIN_USER: ${ONEC_ADMIN_USER:-}
      ONEC_ADMIN_PASSWORD: ${ONEC_ADMIN_PASSWORD:-}
      ONEC_USER: ${ONEC_USER:-}
      ONEC_PASSWORD: ${ONEC_PASSWORD:-}
    ports:
      - "127.0.0.1:${ONEC_PORT:-8314}:8314"
    volumes:
      - onec-data:/onec/data
      - ./onec/config:/onec/config:ro
      - ./onec/ibsrv:/onec/ibsrv:ro
      - ./onec/scripts:/onec/scripts:ro
      - ./fixtures:/onec/fixtures:ro
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8314/hs/recon/accounts"]
      interval: 5s
      timeout: 5s
      retries: 40
volumes:
  postgres-data:
  onec-data:
